name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Typecheck, verificação e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 24: o leitor de entradas do changelog importa os arquivos .ts
          # nativamente (type stripping), como o release.yml já faz.
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: npm ci

      # Regenera o derivado e falha se o catálogo tiver MAIS contradições do que o
      # débito conhecido (0 — todas resolvidas). O catálogo pode melhorar, não
      # piorar. Ao resolver contradições, baixe --max-contradicoes na mesma medida.
      # Também impõe: todo registro é tipo penal, e todo id é único e append-only.
      - name: Validar catálogo de tipos penais
        run: python3 scripts/transform_data.py --estrito --max-contradicoes=0

      # O derivado é commitado; se a transformação mudar o resultado, o PR está
      # desatualizado (o workflow regen-data.yml o regenera após o merge).
      - name: Conferir se static/data/crimes.json está atualizado
        run: git diff --exit-code --stat static/data/crimes.json

      # A base dos atributos é editada à mão: vocabulário, frações, limites, diploma
      # de cada chave e a norma de cada redação contra o histórico legislativo.
      - name: Validar base dos atributos penais
        run: python3 scripts/validar_atributos.py

      # O derivado dos atributos (última alteração e alcance) é commitado como o do
      # catálogo. O alcance depende das penas, por isso vem depois do transform.
      - name: Conferir se static/data/atributos.json está atualizado
        run: |
          npm run atributos
          git diff --exit-code --stat static/data/atributos.json

      # Parser do conferidor: roda só contra as fixtures congeladas em
      # scripts/robos/fixtures — sem rede, portanto sem depender do Planalto
      # estar no ar. O download ao vivo é exclusividade do workflow semanal.
      - name: Testar o parser do conferidor
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/robos/tests -q

      # Entrada do changelog não pode anunciar versão que nunca foi publicada:
      # o bump por substituição de texto já falhou em silêncio três vezes, e o
      # feed ficou prometendo v1.2.16 a v1.2.18 com o projeto em 1.2.15.
      - name: Conferir coerência do changelog
        run: node scripts/validar-changelog.mjs

      - name: Typecheck
        run: npm run typecheck

      # Código morto: arquivo que ninguém importa, exportação sem uso,
      # dependência não listada. A varredura de 24/09/2026 achou seis
      # exportações mortas e dois scripts de migração à mão — e à mão não se
      # repete. As exceções, com motivo, estão em knip.jsonc.
      - name: Varrer código morto
        run: npm run mortos

      # A base dos modificadores da dosimetria: vocabulário, fase, fração e o
      # dispositivo de cada um.
      - name: Validar modificadores da dosimetria
        run: python3 scripts/validar_modificadores.py

      # Invariantes do motor de atributos + casos-âncora de direito penal,
      # avaliados contra o catálogo real de tipos penais.
      - name: Verificar motor de atributos
        run: npm run verificar

      # O congelamento: 22 atributos × 1.496 tipos × 4 cenários. Veredito que
      # muda só passa se tiver sido regravado de propósito, e o commit diz por
      # quê. É a trava mais forte do projeto, e até 24/09/2026 ela não rodava
      # aqui — o README já a anunciava como trava de build, e não era.
      - name: Congelamento dos vereditos
        run: npm run equivalencia

      - name: Build
        run: npm run build

      # Toda rota antiga responde e leva ao destino certo, preservando a query
      # (o script de cada stub é executado contra a tabela de redirecionamentos),
      # e toda ficha nova existe com conteúdo. Uma URL citada que vira 404 em
      # silêncio é o pior defeito possível num catálogo citável.
      - name: Teste de fumaça das rotas
        run: node scripts/verificar_rotas.mjs
