name: Regenerar dados derivados

# Quando data/crimes.json muda (inclusive via edição pela interface web do GitHub),
# roda scripts/transform_data.py e commita o static/data/crimes.json regenerado.
# Assim não é preciso rodar Python localmente para atualizar o catálogo.
#
# O derivado dos atributos (static/data/atributos.json) vem junto: o alcance de
# cada atributo depende das penas do catálogo, e a base dos atributos e o
# histórico legislativo também se editam à mão. O qualidade.json, que traz os
# contadores da página inicial, também é derivado e também é commitado.

on:
  push:
    branches: [main]
    paths:
      - 'data/crimes.json'
      - 'data/atributos.json'
      - 'data/historico-legislativo.json'
      - 'scripts/transform_data.py'
      - 'scripts/derivar_atributos.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escreve-na-main
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    # O Environment é a trava SERVER-SIDE dos secrets do app: com a política de
    # branch restrita à `main`, o GitHub recusa entregar a chave a um job que
    # rode em qualquer outra branch. Sem isso, bastaria a um colaborador com
    # write empurrar uma branch com o workflow adulterado para usar o app —
    # `if:` no YAML e CODEOWNERS não impedem execução fora da main.
    environment: automacao
    steps:
      # O token do app é o que atravessa o ruleset da main (o github-actions[bot]
      # não é ator selecionável no bypass). Enquanto o app não existir, o passo é
      # pulado e tudo segue com o token padrão — o repositório nunca fica preso.
      - name: Token do app de automação (quando configurado)
        id: app
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Regenerar catálogo derivado
        run: python3 scripts/transform_data.py

      - name: Regenerar derivado dos atributos
        run: npm run atributos

      - name: Commitar mudanças (se houver)
        run: |
          ARQUIVOS="static/data/crimes.json static/data/qualidade.json static/data/atributos.json"
          if [ -n "$(git status --porcelain $ARQUIVOS)" ]; then
            git config user.name "sispenas-bot"
            git config user.email "sispenas-bot@users.noreply.github.com"
            git add $ARQUIVOS
            git commit -m "chore(data): regenera os dados derivados [skip ci]"
            git push
          else
            echo "Nenhuma mudança nos dados derivados."
          fi
