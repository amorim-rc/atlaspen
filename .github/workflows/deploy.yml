name: Deploy (GitHub Pages)

# Publica em https://amorim-rc.github.io/atlaspen/ (config em astro.config.mjs).
# Requer, no repositório: Settings > Pages > Source = GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # O Astro 7 exige Node >= 22.12; 24 é o que a CI já usa.
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      # A planilha da base é gerada DENTRO do dist, e nunca commitada. Um binário
      # que se regenera a cada build encheria o histórico de diffs ilegíveis, e a
      # cópia commitada envelheceria em relação ao catálogo — que é o defeito que
      # ela existe para não ter. O caminho é fixo: cada publicação substitui a
      # anterior, e nunca há duas no ar.
      - name: Gerar a planilha da base
        run: |
          python3 -m pip install --quiet openpyxl
          python3 scripts/gerar_planilha.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
